[tools]
node = "24"

[tasks.dev]
description = "Run the Quasar dev server"
run = "npm run dev"

[tasks.install]
description = "Install dependencies"
run = "npm ci"

[tasks.build]
description = "Build the SPA for production"
depends = ["install"]
run = "npm run build"

[tasks.build-pwa]
description = "Build the offline app (PWA) for production"
depends = ["install"]
run = "npm run build:pwa"

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks.format]
description = "Format sources with Prettier (writes)"
run = "npm run format"

[tasks.test]
description = "Run unit tests once (as in CI)"
run = "npm run test:unit:ci"

[tasks.check]
description = "Run the same checks as the PR workflow"
depends = ["lint", "test", "build"]
